# Biomimetic Dev OS - Notion Event Router
# Cloudflare Worker Configuration

name = "notion-event-router"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Development configuration
[vars]
GCP_PROJECT_ID = "arca-471022"
PUBSUB_TOPIC_ID = "os-events"
GITHUB_OWNER = "danxalot"
GITHUB_REPO = "ARCA"
NOTION_WEBHOOK_SECRET = "dev-secret"

[dev]
port = 8787
local_protocol = "http"

# Production environment with custom domain (commented out for verification)
[env.production]
[env.production.vars]
GCP_PROJECT_ID = "arca-471022"
PUBSUB_TOPIC_ID = "os-events"
GITHUB_OWNER = "danxalot"
GITHUB_REPO = "ARCA"
NOTION_WEBHOOK_SECRET = ""

# Using .workers.dev for verification (bypasses Cloudflare bot protection)
# After verification, uncomment the routes below to use custom domain
# routes = [
#   { pattern = "hooks.arca-vsa.tech", custom_domain = true }
# ]
